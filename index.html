<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catch & Match MVP</title>
    <style>
        body { margin: 0; overflow: hidden; background: #f0f4f8; font-family: sans-serif; touch-action: none; }
        canvas { display: block; background: #e0eafc; }
        #score { position: absolute; top: 20px; width: 100%; text-align: center; font-size: 24px; color: #555; pointer-events: none; }
    </style>
</head>
<body>
    <div id="score">النقاط: 0</div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    let score = 0;
    let items = [];
    let gameHeight, gameWidth;

    // إعداد المقاسات لتناسب الآيفون
    function resize() {
        gameWidth = window.innerWidth;
        gameHeight = window.innerHeight;
        canvas.width = gameWidth;
        canvas.height = gameHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // فئات العناصر (المربعات والدوائر)
    class Item {
        constructor() {
            this.size = 50;
            this.x = Math.random() * (gameWidth - this.size);
            this.y = -this.size;
            this.type = Math.random() > 0.5 ? 'circle' : 'square'; // النوع: دائرة أو مربع
            this.color = this.type === 'circle' ? '#ffadad' : '#ffd6a5'; // ألوان لطيفة
            this.speed = 2 + Math.random() * 2;
            this.isDragging = false;
        }

        update() {
            if (!this.isDragging) {
                this.y += this.speed;
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            if (this.type === 'circle') {
                ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI * 2);
            } else {
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
            ctx.fill();
        }
    }

    function createItem() {
        if (Math.random() < 0.02) items.push(new Item());
    }

    // منطقة السلال (أهداف الفرز)
    function drawBins() {
        ctx.fillStyle = 'rgba(255, 173, 173, 0.3)'; // سلة الدوائر (يسار)
        ctx.fillRect(0, gameHeight - 100, gameWidth/2, 100);
        ctx.fillStyle = 'rgba(255, 214, 165, 0.3)'; // سلة المربعات (يمين)
        ctx.fillRect(gameWidth/2, gameHeight - 100, gameWidth/2, 100);
    }

    function update() {
        ctx.clearRect(0, 0, gameWidth, gameHeight);
        drawBins();
        createItem();

        for (let i = items.length - 1; i >= 0; i--) {
            items[i].update();
            items[i].draw();

            // فحص التصادم مع السلال
            if (items[i].y > gameHeight - 100) {
                const inCorrectBin = (items[i].type === 'circle' && items[i].x < gameWidth/2) || 
                                     (items[i].type === 'square' && items[i].x > gameWidth/2);
                
                if (inCorrectBin) score += 1;
                else score = Math.max(0, score - 1); // عقاب بسيط
                
                scoreElement.innerText = "النقاط: " + score;
                items.splice(i, 1);
            } else if (items[i].y > gameHeight) {
                items.splice(i, 1);
            }
        }
        requestAnimationFrame(update);
    }

    // التحكم باللمس للآيفون
    let draggedItem = null;

    canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        items.forEach(item => {
            if (touch.clientX > item.x && touch.clientX < item.x + item.size &&
                touch.clientY > item.y && touch.clientY < item.y + item.size) {
                draggedItem = item;
                item.isDragging = true;
            }
        });
    });

    canvas.addEventListener('touchmove', (e) => {
        if (draggedItem) {
            const touch = e.touches[0];
            draggedItem.x = touch.clientX - draggedItem.size/2;
            draggedItem.y = touch.clientY - draggedItem.size/2;
        }
    });

    canvas.addEventListener('touchend', () => {
        if (draggedItem) {
            draggedItem.isDragging = false;
            draggedItem = null;
        }
    });

    update();
</script>
</body>
</html>
