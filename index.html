<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bunny Jump - Cute MVP</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; touch-action: none; background: #a2d2ff; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; }
        .box { background: rgba(255,255,255,0.7); padding: 8px 15px; border-radius: 20px; font-weight: bold; color: #333; }
        #shop-btn { position: absolute; top: 70px; right: 20px; background: #ffafcc; border: none; padding: 10px; border-radius: 15px; color: white; font-weight: bold; pointer-events: auto; }
        #shop-menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 20px; display: none; width: 70%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); pointer-events: auto; }
        .skin-item { display: inline-block; font-size: 40px; margin: 10px; padding: 10px; border: 2px solid #eee; border-radius: 10px; cursor: pointer; }
        .skin-item.active { border-color: #ffafcc; background: #fff1f5; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="box" id="score">الارتفاع: 0</div>
        <div class="box" id="coins">🥕: 0</div>
    </div>
    <button id="shop-btn" onclick="toggleShop()">المتجر 🛒</button>
    <div id="shop-menu">
        <h3>اختر شخصيتك</h3>
        <div class="skin-item active" onclick="setSkin('🐰')">🐰</div>
        <div class="skin-item" onclick="setSkin('🐱')">🐱</div>
        <div class="skin-item" onclick="setSkin('🐸')">🐸</div>
        <div class="skin-item" onclick="setSkin('👨‍🚀')">👨‍🚀</div>
        <br><button onclick="toggleShop()">إغلاق</button>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let gameWidth, gameHeight;
    let score = 0;
    let coins = 0;
    let bunnySkin = '🐰';
    let cameraY = 0;
    let isGameOver = false;

    function resize() {
        gameWidth = window.innerWidth;
        gameHeight = window.innerHeight;
        canvas.width = gameWidth;
        canvas.height = gameHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // الشخصية
    const player = {
        x: gameWidth / 2,
        y: gameHeight - 100,
        width: 50,
        height: 50,
        vy: 0,
        vx: 0,
        jumpPower: -12,
        gravity: 0.4
    };

    // المنصات
    let platforms = [];
    function createPlatform(y) {
        let type = Math.random() > 0.8 ? 'moving' : 'static';
        platforms.push({
            x: Math.random() * (gameWidth - 70),
            y: y,
            w: 70,
            h: 15,
            type: type,
            speed: type === 'moving' ? 2 : 0,
            hasCoin: Math.random() > 0.9
        });
    }

    // البداية: توليد منصات أولية
    for (let i = 0; i < 10; i++) {
        createPlatform(gameHeight - (i * 100));
    }

    function toggleShop() {
        const m = document.getElementById('shop-menu');
        m.style.display = m.style.display === 'block' ? 'none' : 'block';
    }

    function setSkin(s) {
        bunnySkin = s;
        document.querySelectorAll('.skin-item').forEach(el => el.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    function update() {
        if (isGameOver) return;

        // جاذبية وحركة
        player.vy += player.gravity;
        player.y += player.vy;
        player.x += player.vx;

        // حدود الشاشة (يمين ويسار)
        if (player.x > gameWidth) player.x = -player.width;
        if (player.x < -player.width) player.x = gameWidth;

        // الكاميرا تتبع اللاعب
        if (player.y < cameraY + 200) {
            cameraY = player.y - 200;
        }

        // تحديث المنصات
        platforms.forEach((p, idx) => {
            if (p.type === 'moving') {
                p.x += p.speed;
                if (p.x + p.w > gameWidth || p.x < 0) p.speed *= -1;
            }

            // التصادم مع المنصة (فقط عند السقوط)
            if (player.vy > 0 && 
                player.x + player.width > p.x && player.x < p.x + p.w &&
                player.y + player.height > p.y && player.y + player.height < p.y + p.h + player.vy) {
                player.vy = player.jumpPower;
                if (p.hasCoin) {
                    p.hasCoin = false;
                    coins++;
                    document.getElementById('coins').innerText = "🥕: " + coins;
                }
            }

            // حذف المنصات القديمة وتوليد جديدة
            if (p.y > cameraY + gameHeight + 100) {
                platforms.splice(idx, 1);
                createPlatform(cameraY - 50);
                score = Math.max(score, Math.floor(Math.abs(player.y - (gameHeight - 100)) / 10));
                document.getElementById('score').innerText = "الارتفاع: " + score;
            }
        });

        // الخسارة
        if (player.y > cameraY + gameHeight) {
            isGameOver = true;
            alert("سقط الأرنب! محاولتك كانت رائعة. الارتفاع: " + score);
            location.reload();
        }

        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        // تغيير لون السماء بناءً على الارتفاع
        let hue = 200 - (score / 50);
        ctx.fillStyle = `hsl(${hue}, 60%, 80%)`;
        ctx.fillRect(0, 0, gameWidth, gameHeight);

        ctx.save();
        ctx.translate(0, -cameraY);

        // رسم المنصات
        platforms.forEach(p => {
            ctx.fillStyle = p.type === 'moving' ? '#ffafcc' : '#bde0fe';
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(p.x, p.y, p.w, p.h, 5) : ctx.rect(p.x, p.y, p.w, p.h);
            ctx.fill();
            if (p.hasCoin) {
                ctx.font = "20px serif";
                ctx.fillText("🥕", p.x + p.w/2 - 10, p.y - 5);
            }
        });

        // رسم اللاعب
        ctx.font = "50px serif";
        ctx.textAlign = "center";
        ctx.fillText(bunnySkin, player.x + player.width/2, player.y + player.height);

        ctx.restore();
    }

    // التحكم باللمس
    window.addEventListener('touchstart', (e) => {
        const touchX = e.touches[0].clientX;
        if (touchX < gameWidth / 2) player.vx = -5;
        else player.vx = 5;
    });

    window.addEventListener('touchend', () => {
        player.vx = 0;
    });

    update();
</script>
</body>
</html>
