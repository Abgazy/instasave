<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catch & Match - Cute Version</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        canvas { display: block; }
        #score { 
            position: absolute; 
            top: 40px; 
            width: 100%; 
            text-align: center; 
            font-size: 32px; 
            font-weight: bold;
            color: #444; 
            text-shadow: 2px 2px 4px rgba(255,255,255,0.5);
            pointer-events: none; 
        }
    </style>
</head>
<body>
    <div id="score">النقاط: 0</div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    let score = 0;
    let items = [];
    let gameHeight, gameWidth;
    let bgHue = 200; // للتحكم في لون الخلفية

    function resize() {
        gameWidth = window.innerWidth;
        gameHeight = window.innerHeight;
        canvas.width = gameWidth;
        canvas.height = gameHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Item {
        constructor(typeOverride = null) {
            this.size = 55;
            this.x = Math.random() * (gameWidth - this.size);
            this.y = -this.size;
            this.isDragging = false;
            
            // تحديد النوع: مربع، دائرة، أو نجمة نادرة
            if (typeOverride) {
                this.type = typeOverride;
            } else {
                let rand = Math.random();
                if (rand < 0.05) this.type = 'star'; // نسبة 5% ظهور نجمة
                else if (rand < 0.52) this.type = 'circle';
                else this.type = 'square';
            }

            // الألوان
            if (this.type === 'circle') this.color = '#ffadad';
            else if (this.type === 'square') this.color = '#ffd6a5';
            else this.color = '#fdffb6'; // لون النجمة

            // السرعة تزيد إذا كانت النقاط فوق 20
            let baseSpeed = score >= 20 ? 4 : 2;
            this.speed = baseSpeed + Math.random() * 2;
        }

        update() {
            if (!this.isDragging) {
                this.y += this.speed;
            }
        }

        draw() {
            ctx.save();
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0,0,0,0.1)';

            if (this.type === 'circle') {
                ctx.beginPath();
                ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI * 2);
                ctx.fill();
                this.drawFace();
            } else if (this.type === 'square') {
                ctx.roundRect ? ctx.beginPath() || ctx.roundRect(this.x, this.y, this.size, this.size, 10) || ctx.fill() : ctx.fillRect(this.x, this.y, this.size, this.size);
                if (!ctx.roundRect) ctx.fillRect(this.x, this.y, this.size, this.size);
                this.drawFace();
            } else if (this.type === 'star') {
                this.drawStar(this.x + this.size/2, this.y + this.size/2, 5, this.size/2, this.size/4);
                this.drawFace();
            }
            ctx.restore();
        }

        drawFace() {
            // العيون
            ctx.fillStyle = '#444';
            ctx.beginPath();
            ctx.arc(this.x + this.size*0.35, this.y + this.size*0.4, 4, 0, Math.PI*2);
            ctx.arc(this.x + this.size*0.65, this.y + this.size*0.4, 4, 0, Math.PI*2);
            ctx.fill();
            // الابتسامة
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x + this.size/2, this.y + this.size*0.55, 10, 0.2, Math.PI - 0.2);
            ctx.stroke();
        }

        drawStar(cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;
                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
        }
    }

    function drawBackground() {
        bgHue = (bgHue + 0.1) % 360; // تغيير اللون ببطء
        ctx.fillStyle = `hsl(${bgHue}, 30%, 90%)`;
        ctx.fillRect(0, 0, gameWidth, gameHeight);
        
        // رسم السلال
        ctx.fillStyle = 'rgba(255, 173, 173, 0.4)';
        ctx.fillRect(0, gameHeight - 120, gameWidth/2, 120);
        ctx.fillStyle = 'rgba(255, 214, 165, 0.4)';
        ctx.fillRect(gameWidth/2, gameHeight - 120, gameWidth/2, 120);
        
        // نصوص توضيحية للسلال
        ctx.fillStyle = '#888';
        ctx.font = '16px sans-serif';
        ctx.fillText("دوائر هنا", 40, gameHeight - 50);
        ctx.fillText("مربعات هنا", gameWidth - 100, gameHeight - 50);
    }

    function update() {
        drawBackground();
        if (Math.random() < (score >= 20 ? 0.03 : 0.02)) items.push(new Item());

        for (let i = items.length - 1; i >= 0; i--) {
            items[i].update();
            items[i].draw();

            if (items[i].y > gameHeight - 120) {
                if (items[i].type === 'star') {
                    // النجمة تعطي نقاط أينما سقطت إذا لمست السلال
                    score += 5;
                    items.splice(i, 1);
                } else {
                    const correctSide = (items[i].type === 'circle' && items[i].x < gameWidth/2) || 
                                        (items[i].type === 'square' && items[i].x > gameWidth/2);
                    if (correctSide) score += 1;
                    else score = Math.max(0, score - 1);
                    items.splice(i, 1);
                }
                scoreElement.innerText = "النقاط: " + score;
            } else if (items[i].y > gameHeight) {
                items.splice(i, 1);
            }
        }
        requestAnimationFrame(update);
    }

    let draggedItem = null;
    canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        items.forEach(item => {
            if (touch.clientX > item.x - 20 && touch.clientX < item.x + item.size + 20 &&
                touch.clientY > item.y - 20 && touch.clientY < item.y + item.size + 20) {
                draggedItem = item;
                item.isDragging = true;
            }
        });
    });

    canvas.addEventListener('touchmove', (e) => {
        if (draggedItem) {
            const touch = e.touches[0];
            draggedItem.x = touch.clientX - draggedItem.size/2;
            draggedItem.y = touch.clientY - draggedItem.size/2;
            e.preventDefault(); 
        }
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
        if (draggedItem) {
            draggedItem.isDragging = false;
            draggedItem = null;
        }
    });

    update();
</script>
</body>
</html>
