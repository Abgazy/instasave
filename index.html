<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cute Catch: Premium Edition</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; background: #f0f4f8; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 20px; width: 100%; pointer-events: none; display: flex; justify-content: space-around; align-items: center; }
        .stat { background: rgba(255,255,255,0.8); padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 20px; color: #444; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #shop-btn { position: absolute; bottom: 130px; left: 50%; transform: translateX(-50%); pointer-events: auto; background: #ffcfd2; border: none; padding: 12px 25px; border-radius: 50px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); font-size: 18px; cursor: pointer; box-shadow: 0 4px 0 #eeabb0; }
        #shop-menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 25px; display: none; pointer-events: auto; width: 80%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        .shop-item { display: inline-block; padding: 15px; margin: 10px; border: 3px solid #eee; border-radius: 15px; cursor: pointer; width: 80px; }
        .shop-item.selected { border-color: #ffcfd2; background: #fff5f6; }
        #close-shop { margin-top: 15px; background: #ddd; border: none; padding: 8px 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="stat" id="score-display">💰: 0</div>
    </div>
    
    <button id="shop-btn" onclick="toggleShop()">المتجر 🛒</button>

    <div id="shop-menu">
        <h3>اختر الشكل (التكلفة 0 للتجربة)</h3>
        <div class="shop-item selected" onclick="setSkin('basic')">⚪<br>أشكال</div>
        <div class="shop-item" onclick="setSkin('cats')">🐱<br>قطط</div>
        <div class="shop-item" onclick="setSkin('food')">🍎<br>فواكه</div>
        <div class="shop-item" onclick="setSkin('space')">🚀<br>فضاء</div>
        <br>
        <button id="close-shop" onclick="toggleShop()">إغلاق</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score-display');
    
    let score = 0;
    let items = [];
    let gameWidth, gameHeight;
    let currentSkin = 'basic';
    let bgHue = 200;

    function resize() {
        gameWidth = window.innerWidth;
        gameHeight = window.innerHeight;
        canvas.width = gameWidth;
        canvas.height = gameHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const skins = {
        basic: { circle: '#ffadad', square: '#ffd6a5', cChar: 'O', sChar: '[]' },
        cats: { circle: '#ffc6ff', square: '#bdb2ff', cChar: '🐱', sChar: '🐶' },
        food: { circle: '#ff6b6b', square: '#febf5e', cChar: '🍎', sChar: '🧀' },
        space: { circle: '#a0c4ff', square: '#9bf6ff', cChar: '🪐', sChar: '🛸' }
    };

    class Item {
        constructor(typeOverride = null) {
            this.size = 60;
            this.x = Math.random() * (gameWidth - this.size);
            this.y = -this.size;
            this.isDragging = false;
            
            let rand = Math.random();
            if (typeOverride) this.type = typeOverride;
            else if (rand < 0.08) this.type = 'bomb';
            else if (rand < 0.13) this.type = 'star';
            else if (rand < 0.55) this.type = 'circle';
            else this.type = 'square';

            this.speed = (score >= 50 ? 5 : score >= 20 ? 3.5 : 2.5) + Math.random() * 1.5;
        }

        update() { if (!this.isDragging) this.y += this.speed; }

        draw() {
            ctx.save();
            if (this.type === 'bomb') {
                this.drawEmoji("💣");
            } else if (this.type === 'star') {
                this.drawEmoji("⭐");
            } else if (this.type === 'circle') {
                this.drawEmoji(skins[currentSkin].cChar, skins[currentSkin].circle);
            } else {
                this.drawEmoji(skins[currentSkin].sChar, skins[currentSkin].square);
            }
            ctx.restore();
        }

        drawEmoji(emoji, color) {
            ctx.font = "50px serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            if (color) {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(this.x + 30, this.y + 30, 25, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.fillStyle = "#000";
            ctx.fillText(emoji, this.x + 30, this.y + 30);
        }
    }

    function toggleShop() {
        const menu = document.getElementById('shop-menu');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function setSkin(s) {
        currentSkin = s;
        document.querySelectorAll('.shop-item').forEach(el => el.classList.remove('selected'));
        event.currentTarget.classList.add('selected');
    }

    function drawBins() {
        bgHue = (bgHue + 0.05) % 360;
        ctx.fillStyle = `hsl(${bgHue}, 40%, 95%)`;
        ctx.fillRect(0, 0, gameWidth, gameHeight);

        ctx.fillStyle = 'rgba(255, 173, 173, 0.3)';
        ctx.fillRect(0, gameHeight - 120, gameWidth/2, 120);
        ctx.fillStyle = 'rgba(189, 178, 255, 0.3)';
        ctx.fillRect(gameWidth/2, gameHeight - 120, gameWidth/2, 120);
    }

    function update() {
        ctx.clearRect(0, 0, gameWidth, gameHeight);
        drawBins();

        if (Math.random() < 0.025) items.push(new Item());

        for (let i = items.length - 1; i >= 0; i--) {
            items[i].update();
            items[i].draw();

            if (items[i].y > gameHeight - 100) {
                if (items[i].type === 'bomb') {
                   // القنبلة تنفجر إذا وصلت تحت
                } else if (items[i].type === 'star') {
                    score += 5;
                } else {
                    const side = items[i].x < gameWidth/2 ? 'left' : 'right';
                    if ((items[i].type === 'circle' && side === 'left') || (items[i].type === 'square' && side === 'right')) {
                        score += 1;
                    } else {
                        score = Math.max(0, score - 2);
                    }
                }
                scoreDisplay.innerText = "💰: " + score;
                items.splice(i, 1);
            }
        }
        requestAnimationFrame(update);
    }

    let draggedItem = null;
    canvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        items.forEach((item, idx) => {
            if (touch.clientX > item.x && touch.clientX < item.x + 60 && touch.clientY > item.y && touch.clientY < item.y + 60) {
                if (item.type === 'bomb') {
                    score = Math.max(0, score - 10);
                    scoreDisplay.innerText = "💰: " + score;
                    items.splice(idx, 1);
                    return;
                }
                draggedItem = item;
                item.isDragging = true;
            }
        });
    });

    canvas.addEventListener('touchmove', (e) => {
        if (draggedItem) {
            draggedItem.x = e.touches[0].clientX - 30;
            draggedItem.y = e.touches[0].clientY - 30;
            e.preventDefault();
        }
    }, {passive: false});

    canvas.addEventListener('touchend', () => { if (draggedItem) { draggedItem.isDragging = false; draggedItem = null; } });

    update();
</script>
</body>
</html>
